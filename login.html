<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Luna Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                🌙
            </div>

            <h1>Luna Dashboard</h1>

            <p class="subtitle">
                Welcome back
            </p>

            <form>

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Masukkan username"
                >

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Masukkan password"
                >

                <button type="submit">
                    LOGIN
                </button>

            </form>

            <p class="version">
                Version 0.1
            </p>

        </div>

    </div>

</body>

</html>
